<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Stellar Shards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <div id="hud" class="hidden">
      <div id="hud-left">
        <div id="score-display">Score: <span id="score">0</span></div>
        <div id="timer-display">&#9201; <span id="timer">0</span></div>
      </div>
      <div id="hud-center">
        <div id="module-icons"></div>
      </div>
      <div id="hud-right">
        <span id="currency-display">&#9889; <span id="currency">0</span></span>
        <span id="lives-display">&#10084;&#65039;&#10084;&#65039;&#10084;&#65039;</span>
      </div>
    </div>

    <div id="boss-hud" class="hidden">
      <div id="boss-name">LE NOYAU</div>
      <div id="boss-hp-track"><div id="boss-hp-fill"></div></div>
    </div>

    <div id="title-screen">
      <h1 id="title-logo">STELLAR SHARDS</h1>
      <p id="title-sub">Survive. Collect. Destroy.</p>
      <div id="title-controls">
        <p>ZQSD to move</p>
        <p>SPACE to shoot</p>
      </div>
      <div id="title-menu" class="menu-buttons">
        <button id="title-start-btn" data-action="start">START</button>
        <button id="title-options" data-action="options">OPTIONS</button>
      </div>
      <p id="title-start">Press SPACE to start</p>
    </div>

    <div id="level-complete" class="hidden">
      <h1>LEVEL COMPLETE</h1>
      <p>Score: <span id="lc-score">0</span></p>
      <p>Collected: <span id="lc-currency">+0</span></p>
      <p id="lc-hint">Click to continue</p>
    </div>

    <div id="shop-overlay" class="hidden">
      <h1>SHOP</h1>
      <div id="shop-header">
        <span id="shop-currency-label">&#9889; <span id="shop-currency-amount">0</span></span>
        <span id="shop-level-label">Level <span id="shop-level">2</span></span>
      </div>
      <div id="shop-cards"></div>
      <div id="shop-actions">
        <button id="shop-reroll">REROLL (<span id="shop-reroll-count">2 free</span>)</button>
        <button id="shop-skip">SKIP</button>
      </div>
    </div>

    <div id="game-over" class="hidden">
      <h1>Game Over</h1>
      <p>Level Reached: <span id="final-level">1</span></p>
      <p>Final Score: <span id="final-score">0</span></p>
      <p>&#9889; <span id="final-currency">0</span></p>
      <p id="restart-hint">Press SPACE to restart</p>
    </div>

    <div id="pause-menu" class="menu-overlay hidden">
      <h1>PAUSE</h1>
      <div id="pause-buttons" class="menu-buttons">
        <button id="pause-resume" data-action="resume">RESUME</button>
        <button id="pause-boss-noyau" data-action="boss" data-kind="NOYAU">TEST LE NOYAU</button>
        <button id="pause-boss-comete" data-action="boss" data-kind="COMETE">TEST LA COMÈTE</button>
        <button id="pause-boss-archi" data-action="boss" data-kind="ARCHITECTE">TEST L'ARCHITECTE</button>
        <button id="pause-options" data-action="options">OPTIONS</button>
        <button id="pause-quit" data-action="quit">QUIT TO MENU</button>
      </div>
    </div>

    <!-- Ecran options partage : ouvert depuis le menu titre ou depuis la pause. -->
    <div id="options-screen" class="menu-overlay hidden">
      <h1>OPTIONS</h1>
      <div id="options-buttons" class="menu-buttons">
        <button class="opt-toggle" data-action="toggle" data-key="sound">SOUND <span class="opt-value">ON</span></button>
        <button class="opt-toggle" data-action="toggle" data-key="music">MUSIC <span class="opt-value">ON</span></button>
        <button data-action="back">BACK</button>
      </div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/missile.js"></script>
  <script src="js/player.js"></script>
  <script src="js/falling-object.js"></script>
  <script src="js/spawner.js"></script>
  <script src="js/boss.js"></script>
  <script src="js/boss-comet.js"></script>
  <script src="js/boss-architecte.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/music.js"></script>
  <script src="js/options.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
